<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
:root{--bg:#fff;--fg:#12181f;--muted:#5b6672;--accent:#0b6bcb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e8edf3;--muted:#98a4b3;--accent:#5ab3ff}}
body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center;
font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;padding:16px}
.b{text-align:center;max-width:36ch}
h1{font-size:42px;margin:0 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 22px}
a{color:var(--accent)}
</style>
</head>
<body>
  <div class="b">
    <h1>404</h1>
    <p>That page doesn't exist.</p>
    <a href="/">Back to the homepage</a>
  </div>
</body>
</html>
